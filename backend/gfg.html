ge:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eGood understanding of core PHP and Laravel Framework.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eGood Understanding of loops, data types, condition decision statement\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eGood understanding Of OOPs concepts\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eFamiliarity with HTML, CSS, JavaScript, and jQuery.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eKnowledge of MySQL or any other relational database\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eFamiliarity with version control tools like Git (added advantage).\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eSoft Skills:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eProblem-solving attitude.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eGood communication skills.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eEagerness to learn and a team player mindset.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003ePreferred Skills\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eExposure to frameworks like Laravel (PHP)\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eUnderstanding RESTful APIs.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eHands-on experience through internships or personal projects.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003eWhat We Offer\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eMentorship from experienced development Team.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eOpportunities for skill development\u0026nbsp;\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eExposure real-world projects and cutting-edge technologies.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eA friendly and collaborative work environment.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e"])</script><script>self.__next_f.push([1,"16:T2b9e,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eYou are passionate about quality and how customers experience the products you test. You have the ability to create, maintain and execute test plans in order to verify requirements. As a Quality Engineer at Equifax, you will be a catalyst in both the development and the testing of high priority initiatives. You will develop and test new products to support technology operations while maintaining exemplary standards. As a collaborative member of the team, you will deliver QA services (code quality, testing services, performance engineering, development collaboration and continuous integration). You will conduct quality control tests in order to ensure full compliance with specified standards and end user requirements. You will execute tests using established plans and scripts; documents problems in an issues log and retest to ensure problems are resolved. You will create test files to thoroughly test program logic and verify system flow. You will identify, recommend and implement changes to enhance effectiveness of QA strategies.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"text-decoration: underline; font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eWhat you will do\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eParticipate in designing and building test automation frameworks and coding automated test suites\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eWork with multiple, cross-functional sprint teams to support our automated test-driven methodology\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eAssist with development of test automation processes and standards to enable consistent, high-quality automated tests, identifying tests ready for automation and automation test peer review, and support testing efforts by creating, maintaining, improving and expanding automation test suites.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eSupport continuous integration development efforts, and the project goal of continuous improvement.\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eParticipate in all testing tasks including review of all requirements/acceptance criteria, manual testing, defect tracking, verification and validation support\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003eWhat experience you need\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eBS degree in a STEM major or equivalent job experience required\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eLess than 2 years of software development in testing experience\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eTesting technologies: JIRA, Confluence, Office products\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eCloud Certification Strongly Preferred\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\" data-mce-style=\"text-decoration: underline;\"\u003eWhat could set you apart\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eYou have experience with performance engineering and profiling (e.g. Java JVM, Databases) and tools such as Load Runner, JMeter\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eYou have some exposure to Application performance monitoring tools like Dynatrace and Splunk\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eYou are able to create good acceptance and integration test automation scripts and integrate with Continuous integration (Jenkins) and code coverage tools (Sonar, Clover) to ensure 80% or higher code coverage\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eYou have strong development skills and can code with Java and Spring\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eYou have experience working in a TDD/BDD environment and can utilize technologies such as JUnit, Rest Assured, Appium, Jbehave/Cucumber frameworks, APIs (REST/SOAP)\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eYou understand Continuous Delivery concepts and can use tools including Jenkins/Bamboo and vulnerability tools such as Sonar, Checkmarx/Fortify, etc.\u003c/span\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003e\u003cstrong\u003eAn ability to demonstrate successful performance of our Success Profile skills, including:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eAttention to Detail - Create thorough and accurate documentation of all work including status updates to summarize project highlights; validating that processes operate properly and conform to standards; Organizes own work, following established standards and processes while taking direction from others\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eAutomation - Automate defined test cases and test suites per project; Assist in developing test automation standards\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eCollaboration - Collaborate with peers to understand product functionality and specifications; Collaborate with multiple, cross-functional sprint teams to support automated test-driven methodology\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eExecution - Participate in creating and maintaining test automation frameworks and test suites; Participate in all testing tasks including automated and manual testing, testing support; Expand and maintain test automation created from product specifications and test plan; Identify tests cases as \"ready\" for automation; Record test automation results and defects with details to reproduce the issue in JIRA and Zephyr\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eQuality Control - Create defects as a result of test execution with correct severity and priority; Analyzes discrete sets of information from functional and non-functional test execution; Assist in integrating test automation in the CI environment; Perform verification and validation support\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eQuality Focus - Ensure communications are thorough and accurate for all work documentation including status updates; Peer review created test automation with other SDETs; Review all requirements/acceptance criteria\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: #000000;\"\u003eRisk Mitigation - Work with QE team lead to track and determine prioritization of discovered defects\u003c/span\u003e\u003c/li\u003e\u003cli\u003e\u003cspan style=\"font-size: 12pt; font-family: verdana, geneva, sans-serif; color: rgb(0, 0, 0);\" data-mce-style=\"font-size: 12pt; font-f 3c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eIf you use Rapido, you might have noticed your OTP is the same for every single ride. While Uber and Ola generate a fresh code every time, Rapido gives you a permanent 4-digit Rapid PIN.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eAs a developer, your first thought might be: \"Is this a security flaw?\" Actually, it’s a brilliant UX-first engineering decision. Here is the breakdown:\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e- Zero Friction: Rapido users are usually in a hurry. Waiting for an SMS or hunting for a new code creates \"friction.\" A static PIN means you can start your ride the moment you see your Captain even if your phone just died or you have zero network. \u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e- Cost \u0026amp; Infrastructure: In a dynamic system, the backend must generate, store, and trigger an SMS for every booking. A static PIN deletes this entire cycle, saving massive amounts in SMS gateway costs and reducing server overhead. \u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e- Contextual Security: A 4-digit PIN only has 10,000 combinations. It’s not \"unbreakable,\" but it doesn't need to be. To \"steal\" a ride, an attacker needs your PIN and needs to be standing at your exact pickup location at the exact time your Captain arrives. The real-world context is the actual security layer. \u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e- Verification vs. Authentication: The goal here isn't to stop hackers; it's to stop \"wrong pickups\" or \"fake starts\" by drivers. A static PIN solves this perfectly while being much easier for the user to remember.\u003c/span\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"26:T1242,"])</script><script>self.__next_f.push([1,"\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eThe Importance of Logic Building in Codin
